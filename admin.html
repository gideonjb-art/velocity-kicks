<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velocity Admin Pro</title>

<link rel="stylesheet" href="admin.css">
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
<h2>Velocity Admin</h2>

<a href="#add">➕ Add Product</a>
<a href="#inventory">📦 Inventory</a>
<a href="#orders">🛒 Orders</a>
<button id="logoutBtn">
Logout
</button>
</div>

<!-- MAIN -->
<div class="main">

<!-- ADD PRODUCT -->
<div class="card" id="add">
<h2>Add Product</h2>

<input id="prodName" placeholder="Product Name">

<input id="prodPrice" type="number" placeholder="Price">

<input id="prodStock" type="number" placeholder="Stock">
  <select id="prodCategory">
<option value="men">Men</option>
<option value="women">Women</option>
<option value="kids">Kids</option>
</select>
  <select id="prodBrand">

<option value="">
No Brand
</option>

<option value="Nike">
Nike
</option>

<option value="Adidas">
Adidas
</option>

<option value="Jordan">
Jordan
</option>

<option value="New Balance">
New Balance
</option>

<option value="Puma">
Puma
</option>

<option value="Clarks">
Clarks
</option>

</select>
<input
id="prodSizes"
placeholder="Available Sizes (e.g 38,39,40,41,42)"
>

<textarea
id="prodDescription"
placeholder="Product Description"
rows="5"
></textarea>

<input type="file" id="imageFile" accept="image/*">

<img id="previewImg">

<br><br>

<button onclick="addProduct()" id="addBtn">
Save Product
</button>
</div>

<!-- INVENTORY -->
<div class="card" id="inventory">
<h2>Inventory</h2>

<table>
<thead>
<tr>
<th>Image</th>
<th>Name</th>
<th>Brand</th>
<th>Price</th>
<th>Stock</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="productTable"></tbody>
</table>
</div>

<!-- ORDERS -->
<div class="card" id="orders">
<h2>Orders</h2>

<table>
<thead>
<tr>
<th>Product</th>
<th>Size</th>
<th>Status</th>
</tr>
</thead>

<tbody id="ordersTable"></tbody>
</table>
</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  
<script src="admin.js"></script>

<script src="https://cdn.jsdelivr.net/npm/eruda"></script>

</body>
</html>
